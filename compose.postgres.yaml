name: 23l-0907_a2_ops
services:
  db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionguard}
      POSTGRES_USER: ${POSTGRES_USER:-visionguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_wal_size=128MB", "-c", "min_wal_size=32MB", "-c", "shared_buffers=64MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  postgres_data:
