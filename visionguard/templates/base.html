<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Check an image for AI-generated patterns and review your saved results.">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='upload.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('upload') }}">VisionGuard<span>23L-0907_A2_Ops</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('upload') }}" {% if request.endpoint == 'upload' %}aria-current="page"{% endif %}>Classify</a>
      <a href="{{ url_for('history') }}" {% if request.endpoint == 'history' %}aria-current="page"{% endif %}>History</a>
      <a href="{{ url_for('health') }}">Health</a>
    </nav>
  </header>
  <main id="main" class="page">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>A model’s opinion, not proof of origin.</span><span>VisionGuard · Image classification</span></footer>
</body>
</html>
